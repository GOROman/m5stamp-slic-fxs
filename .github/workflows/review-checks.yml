name: Review regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Itests tests/exchange_test.cpp -o /tmp/exchange-test
      - run: /tmp/exchange-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Itests tests/dtmf_test.cpp -o /tmp/dtmf-test
      - run: /tmp/dtmf-test
