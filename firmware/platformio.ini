; M5StampS3 (ESP32-S3FN8, 8MB) 向け。
; この基板のデバッグヘッダは GPIO43/44 (UART0)。
; USB CDC を有効にすると Serial がモジュール上の USB になり、ヘッダにログが出ない。
; 書き込みは Stamp 本体の USB（ダウンロードモード）を使う。

[platformio]
src_dir = .
default_envs = m5stamp-s3

[env:m5stamp-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
build_src_filter = +<*> -<test_ring_timing.cpp>
