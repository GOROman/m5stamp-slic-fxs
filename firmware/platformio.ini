; M5StampS3 (ESP32-S3FN8, 8MB) 向け。
; この基板のデバッグヘッダは GPIO43/44 (UART0)。
; USB CDC を有効にすると Serial がモジュール上の USB になり、ヘッダにログが出ない。
; 書き込みは Stamp 本体の USB（ダウンロードモード）を使う。

[platformio]
src_dir = .
default_envs = m5stamp-s3

[env:m5stamp-s3]
; バージョン固定 (Issue #4): espressif32 7.0.1 = Arduino core 2.0.17。
; ファームウェアは LEDC 互換シムで core 2.x/3.x 両対応だが、解決先が
; 将来勝手に変わらないようプラットフォームをピン留めする。
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
build_src_filter = +<*> -<test_ring_timing.cpp>
